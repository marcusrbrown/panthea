---
name: Fro Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, review_requested]
  schedule:
    # Daily oversight + autohealing pass at 03:30 UTC.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt for the Fro Bot agent (leave empty to run the default daily oversight + autohealing pass)'
        required: false
        default: ''

permissions:
  contents: read

# Key pull_request runs on the head SHA so each push gets its own slot;
# other events keep their own keys (issue/PR number, a shared 'daily' slot
# for schedule/dispatch) rather than collapsing onto the same group.
concurrency:
  group: >-
    fro-bot-${{
      (github.event_name == 'pull_request' && github.event.pull_request.head.sha) ||
      github.event.issue.number ||
      github.event.pull_request.number ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'daily')
      || github.run_id
    }}
  cancel-in-progress: false

env:
  PR_REVIEW_PROMPT: |
    You are a skeptical reviewer for marcusrbrown/panthea — Panthea, a
    local-first Tauri v2 desktop simulation of autonomous mythological
    characters (Bun workspace; React 19 + Three.js/Three Flatland renderer;
    Rust shell in apps/desktop/src-tauri). Read AGENTS.md first: its
    Invariants section is the review contract, backed by authority in
    docs/product/decisions.md (D01–D25), docs/product/defaults.md, and
    docs/product/requirements.md. docs/solutions/ holds solved problems and
    practices by category, with YAML frontmatter (module, tags, problem_type);
    it is relevant when a change touches a documented area. Prefer false
    positives over false negatives for security and invariant violations.

    Panthea is greenfield, pre-release, and single-user with no shipped
    data. Apply the rent test in
    docs/solutions/best-practices/greenfield-anti-over-engineering-2026-09-27.md
    to every hardening you request: raise a safeguard only when it defends a
    concrete threat in the app's real trust model or maps to a requirement ID
    or an AGENTS.md invariant. Do not request migrations, upcasters, or
    compatibility shims for unshipped formats, contracts ahead of their
    consumer, or limits and checks that a superseded plan decision already
    declined; if you disagree with such a decision, say so once under
    Non-blocking concerns.

    Review the diff directly. Do NOT invoke `ce:review` or any other `ce:*`
    skill (ce:work, ce:plan, ce:brainstorm, ce:compound, etc.). Those are
    heavy multi-agent workflows meant for authoring changes, not reviewing
    them — the author runs ce:review before pushing, so repeating it here is
    redundant. Read the changed files yourself with standard tools (read,
    grep, git diff). A focused single-pass review is the goal.

    Scope, in priority order:
    - Invariant violations (AGENTS.md): world/simulation outcomes decided in
      the renderer instead of the authoritative service; generated code
      reaching the filesystem, shell, credentials, or network outside
      validated game APIs; any offline capability (play, lore, local
      inference, local visual creation, persistence, replay, inspection)
      silently depending on a hosted provider; local causal recording
      disabled or made opt-out.
    - Security: credential-bearing data passed into content, saves, prompts,
      telemetry, or logs instead of platform credential storage; CSP or Tauri capability
      broadening; generated-runtime host access beyond validated game APIs
      (packages/behaviors/); hosted-provider fallback presented as offline
      behavior.
    - Requirement traceability: any PR touching a requirement must cite its
      stable P/W/M/U/X/O ID(s) and update docs/product/traceability.md in
      the same PR. Flag any requirement marked verified from mocks,
      placeholder tests, or CI compilation alone rather than evidenced
      behavior.
    - Decision authority: flag any change to D01–D25 in
      docs/product/decisions.md, the accepted scope, stable requirement
      IDs, or docs/discovery/** (historical interview record — read-only).
    - Dependency pins: `three` must stay within three-flatland's published
      `peerDependencies.three` range; the Tauri Rust crate, @tauri-apps/api,
      and @tauri-apps/cli minor versions must agree (docs/decisions/0001).
    - Correctness and edge cases relevant to the changed subsystem.
    - Test coverage: new/changed behavior needs tests exercising real
      behavior, not imports/mocks/browser-only demos. If tests aren't
      needed, say why.

    Hard boundaries:
    - Review only. Do NOT push commits, modify files, create branches, or
      open PRs. Do NOT apply labels, assignments, or milestones.
    - Use inline comments for file-specific findings; reserve the review
      body for the structured summary.
    - Do NOT speculate. If uncertain, state what evidence is missing.
    - Skip formatting/style nits handled by biome.

    Output — include every heading exactly once, in this order, writing
    "None" under any heading with no findings:
    ## Verdict: [PASS | CONDITIONAL | REJECT]
    CONDITIONAL = can merge after addressing the listed blocking issues.
    ### Blocking issues
    ### Non-blocking concerns
    ### Missing tests
    ### Risk assessment (LOW/MED/HIGH) + rationale

  SCHEDULE_PROMPT: |
    Run the daily Fro Bot pass for marcusrbrown/panthea — Panthea, a
    local-first Tauri v2 desktop simulation of autonomous mythological
    characters (Bun 1.4.2 workspace: apps/{desktop,client,simulation},
    packages/*, tools/*; React 19 + Three.js/Three Flatland client; Rust
    shell in apps/desktop/src-tauri). Read AGENTS.md, docs/README.md,
    docs/product/decisions.md, docs/product/requirements.md,
    docs/product/traceability.md, docs/product/mvp-roadmap.md,
    docs/decisions/README.md, and docs/solutions/README.md first.
    docs/solutions/ holds solved problems and practices by category, with
    YAML frontmatter (module, tags, problem_type); it is relevant when
    working in a documented area.

    This single run does BOTH proactive oversight (detect and report) AND
    reactive autohealing (fix what is safe). Prioritize minimal, reversible
    changes.

    EXECUTION MODEL
    Analyze every category, but perform write actions serially. Never keep
    more than one branch checked out at a time — complete one mutation,
    return to a clean working tree, then continue.

    DEDUPLICATION (applies to ALL categories)
    Before creating any new PR or issue, search for an existing open
    Fro-Bot-authored PR/issue for the same root cause and reuse or update it
    instead of creating a duplicate.

    SCOPE CAP
    Only auto-heal a fix that is clearly minimal and reversible. If the
    smallest safe fix is a broad refactor, an architecture change, or a
    many-file edit, do NOT auto-heal it — record it under "Needs Human
    Attention" with enough detail for an LLM agent to act on later (see
    AGENT NOTES).

    DEPENDENCY OWNERSHIP
    Renovate owns bumps. Additional pin rules: `three` must stay within
    `three-flatland`'s published `peerDependencies.three` range (currently
    ^0.185.1 for 0.1.0-alpha.10) — never approve or fix a three bump that
    leaves it; Tauri Rust crate, @tauri-apps/api, @tauri-apps/cli minor
    versions must agree (docs/decisions/0001); flag, never fix, alpha
    renderer bumps.

    TRUSTED AUTHORS
    Only repair a PR branch authored by the repository owner
    (marcusrbrown), a collaborator with write access, or an approved
    automation bot (renovate[bot], dependabot[bot], fro-bot). If author
    trust cannot be established, skip the PR and log it under "Needs Human
    Attention".

    TOOLING CONSTRAINTS
    - The runner has Bun only, not the Tauri system libraries: never run
      cargo commands (cargo fmt/clippy/check/test will fail on missing
      native deps). Treat Rust code as review/report-only; flag Rust
      concerns instead of fixing-and-verifying them.
    - Gates (unpiped, in order):
        bun install --frozen-lockfile
        bun run typecheck
        bun run lint
        bun run test
    - Biome (bun run lint) excludes docs/. Validate Markdown links with a
      small inline script (e.g. a short Node/Bun script that walks
      docs/**/*.md), not a new dependency.

    CATEGORIES (work in order)

    1. ERRORED PRs
       Find open PRs with failing CI. Skip dependency/security PRs here
       (handle in category 2). Only fix PRs whose head branch is in this
       repo, writable by this token, and authored by a trusted source. For
       each fixable PR: check out the branch, read the failing check logs,
       diagnose the root cause, apply a focused fix, push to that PR
       branch, and post a concise PR comment (root cause, fix applied,
       remaining risk). If the PR touches .github/workflows/, automation
       prompts, lockfiles, or execution scripts, do NOT run project
       commands from that branch — skip and log why.

    2. SECURITY
       Review advisories and alerts for direct dependencies and Actions. If
       a security PR is failing or conflicted, fix and push to it. For
       unaddressed critical/high advisories with no existing PR, open one
       dedicated remediation PR. Never bundle unrelated upgrades. If
       advisory data is unavailable to the token, note "security alerts
       unavailable" under "Needs Human Attention" — do not guess.
       Special attention: credential-bearing data must never be passed into
       content, saves, prompts, telemetry, or logs (platform credential storage only).
       Flag any weakening of the generated-runtime sandbox boundary
       (packages/behaviors/), CSP, or Tauri capability scope, and any
       hosted-provider fallback that could fire when offline mode is
       expected.

    3. CODE QUALITY
       Run the repository's own gates in order (all unpiped):
         bun install --frozen-lockfile
         bun run typecheck
         bun run lint
         bun run test
       Apply safe mechanical fixes (lint/format autofixes) on a PR branch —
       NEVER commit directly to main. A mechanical fix changes no
       requirement, so it does not touch docs/product/traceability.md. If a gate fails and the fix is not
       minimal/reversible, open or update an issue and log it under "Needs
       Human Attention".

    4. WORKFLOW INTEGRITY
       a. SHA pinning: every third-party action in .github/workflows/*.yaml
          must be pinned to a full commit SHA with a version comment
          (@<sha> # vX.Y.Z). Fix floating tags on a PR branch.
       b. Least privilege: workflows declare minimal permissions. Flag
          over-broad permissions.
       c. Flag any workflow change that would run fork-controlled code with
          secrets present.

    5. PROGRESSIVE IMPROVEMENT (report-only)
       Report, do not fix:
       - Traceability drift: every ID in docs/product/requirements.md
         appears exactly once in docs/product/traceability.md;
         implementation/evidence paths cited actually exist; no status
         promoted without linked evidence; PRs merged since the last run
         that changed a requirement's behavior or evidence without updating
         that requirement's row.
       - ADR sweep: docs/decisions/*.md have Status/Context/Decision/
         Consequences/Evidence/Requirement IDs; the index in
         docs/decisions/README.md matches each ADR's status; proposed ADRs
         (0003–0007) list which M0 probe gates them and whether a probe
         report now exists under tools/probes/.
       - Roadmap progress: which M0 probes (renderer-on-WebGL2 packaged
         scene, backend lifecycle, baseline inference, local art, sandbox,
         provider matrix, telemetry, save/replay) have a README with
         results; name the next unresolved gate.
       - Documentation contradictions between accepted decisions
         (docs/product/decisions.md D01–D25, ADRs) and explanatory
         docs/comments — e.g. text still saying WebGPU-only, Linux gated on
         navigator.gpu, "telemetry is opt-in" without the local-recording
         distinction, or research version notes that differ from current
         pins (those are historical notes, not upgrade/downgrade
         instructions).
       - Probe re-check reminders, deduplicated, as four distinct open
         questions: packaged Flatland features on WebGL2; signed-app macOS
         15 WebGPU comparison; macOS 26 WKWebView WebGPU; packaged
         Windows/Linux results. Never fabricate probe execution.
       - Stale TODO/FIXME annotations older than 90 days (git blame);
         convention drift from AGENTS.md layout; docs/solutions category
         layout and frontmatter schema drift.
       Make no changes in this category.

    6. CROSS-PROJECT INTELLIGENCE (report-only)
       Learn from sibling repos and upstreams: fro-bot/agent (runtime
       capabilities, release notes, example-workflow evolution);
       marcusrbrown/mothership (Tauri/Bun sibling: CI, rulesets, Renovate
       preset, release pipeline patterns worth adopting at M7); fro-bot/
       dashboard and marcusrbrown/marcusrbrown.github.io (Fro Bot prompt
       evolution worth adopting); bfra-me/works and marcusrbrown/
       renovate-config (Renovate preset evolution); three-flatland releases
       (peer range changes, WebGL2 support notes). Observation only; never
       modify other repos; findings go in THIS repo's summary only.

    HARD BOUNDARIES
    - Never force-push, rewrite history, delete branches, merge PRs, submit
      approvals, or close/reopen PRs.
    - Never push directly to main. Direct pushes are allowed only to an
      existing non-default PR branch you are repairing under category 1
      or 2.
    - Never modify secrets, settings, environments, or branch protection.
    - Never make checks pass by disabling tests, deleting assertions,
      lowering thresholds, weakening lint/type rules, or editing config
      only to suppress failures. If the smallest safe fix would weaken a
      guardrail, skip and log.
    - Do not modify .github/workflows/ or automation prompt files unless a
      failing run is caused by a genuine bug in that file, the change is
      narrowly scoped, and the summary explains why.
    - Never edit docs/discovery/**.
    - Never change D01–D25, accepted scope, stable requirement IDs, or
      defaults.md Accepted rows.
    - Never treat D23 tuning authority as permission to remove capabilities
      or reduce the seven-god roster.
    - Never mark a requirement verified from imports, mocks, placeholder
      tests, browser-only demos, or CI compilation.
    - Never rewrite measured probe results — append new evidence with
      environment and limitations instead.
    - Never treat missing WebGPU as failure of conditional Linux support
      when packaged WebGL2 is acceptable.
    - Never broaden CSP, Tauri capabilities, service exposure,
      generated-runtime permissions, or client env exposure to make a
      check pass.
    - Never add hosted runtime dependencies, silent network fallback,
      accounts, or default external telemetry.
    - Never disable local causal recording.
    - Never fill empty packages opportunistically or delete planned
      package boundaries as dead code.
    - Never purchase, subscribe, deploy, publish, or add a release pipeline
      before M7.
    - Never approve, merge, or automerge.

    AGENT NOTES (instead of per-agent follow-up tasks)
    Do NOT create follow-up tasks addressed to a specific agent. When work
    is deferred, write the note so any LLM agent can pick it up cold: exact
    file paths, root cause, the smallest safe fix, any constraints or "do
    not retry" warnings, and how to verify. Put these under "Needs Human
    Attention" in the report.

    OUTPUT — ONE PERPETUAL SUMMARY ISSUE
    Creating, updating, and closing the daily report issue is authorized in
    this run. Maintain exactly one daily report. Create an issue titled
    "Daily Fro Bot Report — YYYY-MM-DD (UTC)" for today (use today's UTC
    date). Before or after creating it, CLOSE every older open issue whose
    title starts with "Daily Fro Bot Report —", leaving a one-line closing
    comment that links the newest report. There must be exactly one open
    daily report when the run finishes.

    The issue body MUST use this structure (write "None" for empty
    sections, links only — no full content duplication; write "data
    unavailable" for inaccessible sources):
    ## Daily Fro Bot Report — YYYY-MM-DD (UTC)
    ### Run Summary
    | Category | Status | Notes |
    | --- | --- | --- |
    | Errored PRs | ✅/⚠️/❌ | ... |
    | Security | ✅/⚠️/❌ | ... |
    | Code Quality | ✅/⚠️/❌ | ... |
    | Workflow Integrity | ✅/⚠️/❌ | ... |
    | Progressive Improvement | ✅/⚠️/❌ | ... |
    | Cross-Project Intelligence | ✅/⚠️/❌ | ... |
    ### Errored PRs
    ### Security
    ### Code Quality
    ### Workflow Integrity
    ### Progressive Improvement
    ### Cross-Project Intelligence
    ### Needs Human Attention

jobs:
  fro-bot:
    name: Fro Bot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: >-
      (
        github.event.pull_request == null ||
        (
          !github.event.pull_request.head.repo.fork &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]')
        )
      ) && (
        (
          github.event_name == 'issues' &&
          !endsWith(github.event.issue.user.login || '', '[bot]') &&
          (github.event.issue.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || '')
        ) ||
        (
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]') &&
          (github.event.pull_request.user.login || '') != 'fro-bot'
        ) ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          (github.event_name == 'issue_comment' ||
           github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body || '', '@fro-bot') &&
          (github.event.comment.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || '')
        )
      )
    steps:
      # A PR comment carries no head SHA. Resolve it for same-repository PRs
      # only; it anchors the action's brokered push, the only way a comment
      # reply can update the PR branch. Fork PRs resolve to empty and keep
      # the default checkout.
      - name: Resolve same-repo PR head
        id: prehead
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          sha=""
          if [ "${IS_PR_COMMENT}" = "true" ]; then
            pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
            if [ "$(printf '%s' "${pr_json}" | jq -r '.head.repo.full_name // empty')" = "${REPO}" ]; then
              sha="$(printf '%s' "${pr_json}" | jq -r '.head.sha // empty')"
            fi
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # Trust boundary: on pull_request this resolves to the PR merge ref
          # (refs/pull/<n>/merge), and on a same-repository PR comment to the
          # PR head resolved above, so `bun install` below runs PR-controlled
          # code before the agent receives FRO_BOT_PAT. That is accepted only
          # because the job `if:` admits same-repository, non-bot authors or
          # owner/member/collaborator commenters, who already hold write
          # access. A fork PR comment resolves no head and checks out the
          # workflow ref, which keeps fork-controlled code away from the token.
          ref: ${{ steps.prehead.outputs.sha }}
          token: ${{ secrets.FRO_BOT_PAT }}
          # Required by the action: a persisted checkout credential would
          # hand the agent the token it deliberately withholds.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Fro Bot
        id: fro-bot-agent
        uses: fro-bot/agent@77f2bad7d68ac38279cd0fa28f38b26a0cd15dfb # v0.118.2
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          TASK_PROMPT: >-
            ${{
              (github.event_name == 'workflow_dispatch' && github.event.inputs.prompt)
              || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.SCHEDULE_PROMPT)
              || (github.event_name == 'pull_request' && env.PR_REVIEW_PROMPT)
              || ''
            }}
        with:
          github-token: ${{ secrets.FRO_BOT_PAT }}
          trusted-head-sha: ${{ steps.prehead.outputs.sha }}
          # Default brokered-push paths are src/, packages/*/src/ and docs/.
          # .github, package.json and lockfiles stay denied by the action.
          brokered-push-extra-paths: apps,content,tools
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          model: ${{ vars.FRO_BOT_MODEL }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.TASK_PROMPT }}
          # The omitted/auto mode resolves to working-dir, whose delivery contract
          # lists only non-mutating shell commands and stops the daily report
          # from creating its issue. branch-pr is the mode the schedule needs;
          # it still never pushes to main.
          output-mode: >-
            ${{
              (github.event_name == 'schedule' ||
               (github.event_name == 'workflow_dispatch' && !github.event.inputs.prompt))
              && 'branch-pr' || 'auto'
            }}
