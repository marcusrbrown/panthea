[package]
name = "panthea-desktop"
version = "0.1.0"
description = "Panthea — desktop shell"
authors = ["Marcus R. Brown"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "panthea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned exactly, not the originally scaffolded 2.11.5: with 2.11.5, cargo
# resolved tauri-runtime/tauri-runtime-wry to 2.12.0 (published the same day)
# and the crate failed to compile against that mismatched internal API. The
# pin was 2.12.0 and is now 2.12.1 (#70); Cargo.lock has tauri, tauri-runtime,
# and tauri-runtime-wry all at 2.12.1. The JS @tauri-apps/api and
# @tauri-apps/cli are exact 2.12.0 pins in apps/client and apps/desktop
# package.json, so the crate and the JS packages agree on minor 2.12 (ADR-0001)
# and differ by one patch.
# `tray-icon`: the tray keeps the shell running after window close
# rather than quitting the whole app.
tauri = { version = "=2.12.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# Plain HTTP to the loopback sidecar; no TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1", default-features = false, features = ["time"] }
# Credential storage: the app links the store crates directly (keyring 4.2's
# own docs advise this over its `v1` convenience mode) and keeps the Apple
# store as an instance, never as a process-global default.
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt"] }
